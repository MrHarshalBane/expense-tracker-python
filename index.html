<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker – Python & Web Edition</title>
  <meta name="description" content="A modern, responsive personal expense tracker with budget analytics, categories, and interactive breakdown charts." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-icon"><i class="fa-solid fa-wallet"></i></div>
        <div>
          <h1>Expense Tracker</h1>
          <p class="subtitle">Python Edition • Live Web Application</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" id="btn-export-json"><i class="fa-solid fa-download"></i> Export JSON</button>
        <button class="btn btn-outline" id="btn-reset-data"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      </div>
    </header>

    <!-- Stat Summary Cards -->
    <section class="stats-grid">
      <div class="stat-card income">
        <div class="stat-icon"><i class="fa-solid fa-money-bill-trend-up"></i></div>
        <div class="stat-info">
          <span class="stat-label">Monthly Income</span>
          <div class="stat-val" id="display-income">₹0.00</div>
        </div>
      </div>

      <div class="stat-card expense">
        <div class="stat-icon"><i class="fa-solid fa-receipt"></i></div>
        <div class="stat-info">
          <span class="stat-label">Total Spent</span>
          <div class="stat-val" id="display-total-expense">₹0.00</div>
        </div>
      </div>

      <div class="stat-card balance" id="card-balance">
        <div class="stat-icon"><i class="fa-solid fa-scale-balanced"></i></div>
        <div class="stat-info">
          <span class="stat-label">Remaining Balance</span>
          <div class="stat-val" id="display-balance">₹0.00</div>
        </div>
      </div>

      <div class="stat-card count">
        <div class="stat-icon"><i class="fa-solid fa-tags"></i></div>
        <div class="stat-info">
          <span class="stat-label">Transactions</span>
          <div class="stat-val" id="display-tx-count">0</div>
        </div>
      </div>
    </section>

    <!-- Main Content Layout -->
    <main class="main-layout">
      <!-- Left Column: Add Expense Form & Budget Settings -->
      <section class="panel form-panel">
        <div class="panel-header">
          <h2><i class="fa-solid fa-plus-circle"></i> Add Expense</h2>
        </div>

        <form id="expense-form" class="expense-form">
          <div class="form-group">
            <label for="input-income"><i class="fa-solid fa-coins"></i> Monthly Income (₹)</label>
            <div class="input-with-action">
              <input type="number" id="input-income" placeholder="e.g. 50000" min="0" step="1" />
              <button type="button" class="btn btn-sm btn-primary" id="btn-set-income">Update</button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="input-date"><i class="fa-regular fa-calendar"></i> Date</label>
              <input type="date" id="input-date" required />
            </div>

            <div class="form-group">
              <label for="input-amount"><i class="fa-solid fa-indian-rupee-sign"></i> Amount (₹) *</label>
              <input type="number" id="input-amount" placeholder="e.g. 450" min="1" step="any" required />
            </div>
          </div>

          <div class="form-group">
            <label for="select-category"><i class="fa-solid fa-layer-group"></i> Category *</label>
            <select id="select-category" required>
              <option value="Food">🍔 Food & Dining</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Shopping">🛍️ Shopping</option>
              <option value="Bills">💡 Bills & Utilities</option>
              <option value="Entertainment">🎬 Entertainment</option>
              <option value="Healthcare">💊 Healthcare</option>
              <option value="Other">📦 Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="input-description"><i class="fa-solid fa-pen-to-square"></i> Description</label>
            <input type="text" id="input-description" placeholder="e.g. Lunch with team, petrol..." />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-plus"></i> Add Transaction</button>
            <button type="button" class="btn btn-outline btn-block" id="btn-clear-form">Clear Form</button>
          </div>
        </form>

        <div class="python-badge">
          <i class="fa-brands fa-python"></i> Compatible with original <code>expenses.json</code> schema
        </div>
      </section>

      <!-- Right Column: Analytics & Transactions -->
      <section class="panel right-panel">
        <div class="analytics-tabs">
          <button class="tab-btn active" data-tab="tab-list"><i class="fa-solid fa-list"></i> Transactions</button>
          <button class="tab-btn" data-tab="tab-charts"><i class="fa-solid fa-chart-pie"></i> Visual Analytics</button>
        </div>

        <!-- Transactions Tab -->
        <div class="tab-content active" id="tab-list">
          <div class="filter-bar">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="input-search" placeholder="Filter by note or category..." />
            </div>
            <select id="filter-category">
              <option value="All">All Categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="transactions-list-container">
            <div class="transactions-list" id="transactions-list">
              <!-- Rendered items -->
            </div>
          </div>
        </div>

        <!-- Visual Analytics Tab -->
        <div class="tab-content" id="tab-charts">
          <div class="charts-grid">
            <div class="chart-box">
              <h3>Expense by Category</h3>
              <div class="chart-canvas-wrapper">
                <canvas id="categoryChart"></canvas>
              </div>
            </div>
            <div class="chart-box">
              <h3>Category Breakdown Summary</h3>
              <div id="category-legend" class="category-legend"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Made for <b>expense-tracker-python</b> • <a href="https://github.com/MrHarshalBane/expense-tracker-python" target="_blank">View on GitHub</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
